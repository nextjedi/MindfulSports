# iOS CI/CD pipeline — builds the Mindful Sports IPA and uploads to TestFlight.
# Triggers on pushes to main that touch iosApp or shared.
# Fastlane handles Xcode complexity; Azure DevOps handles scheduling and secrets injection.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - iosApp/**
      - shared/**

pool:
  vmImage: 'macOS-14'

steps:
  - template: templates/ios-build.yml
