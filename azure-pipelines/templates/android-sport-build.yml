# Reusable template — build and publish one Android sport flavor AAB to Play Store.
# Called from android-pipeline.yml via the matrix strategy.

parameters:
  - name: sportId          # e.g. "tennis"
    type: string
  - name: sportFlavorName  # e.g. "Tennis" (capitalized, used in Gradle task name)
    type: string
  - name: packageName      # e.g. "com.mindful.tennis"
    type: string

steps:

  # 1. Load sport-specific secrets from Azure Key Vault
  - task: AzureKeyVault@2
    displayName: 'Load ${{ parameters.sportId }} secrets from Key Vault'
    inputs:
      azureSubscription: 'MindfulSports-ServiceConnection'
      KeyVaultName: 'mindful-sports-kv'
      SecretsFilter: >
        ${{ parameters.sportId }}-supabase-url,
        ${{ parameters.sportId }}-supabase-anon-key,
        ${{ parameters.sportId }}-revenuecat-android-key,
        ${{ parameters.sportId }}-google-client-id,
        ${{ parameters.sportId }}-keystore-password,
        ${{ parameters.sportId }}-keystore-alias,
        ${{ parameters.sportId }}-keystore-file-base64

  # 2. Decode base64 keystore to a .jks file
  - bash: |
      echo "$(${SPORT_ID}-keystore-file-base64)" | base64 --decode > keystore.jks
      echo "Keystore decoded for ${{ parameters.sportId }}"
    displayName: 'Decode keystore for ${{ parameters.sportId }}'
    env:
      SPORT_ID: ${{ parameters.sportId }}

  # 3. Inject credentials into local.properties
  - bash: |
      cat >> local.properties << EOF
      ${{ parameters.sportId }}.supabase.url=$(${SPORT_ID}-supabase-url)
      ${{ parameters.sportId }}.supabase.anon.key=$(${SPORT_ID}-supabase-anon-key)
      ${{ parameters.sportId }}.revenuecat.android.key=$(${SPORT_ID}-revenuecat-android-key)
      ${{ parameters.sportId }}.google.client.id=$(${SPORT_ID}-google-client-id)
      EOF
    displayName: 'Write ${{ parameters.sportId }} credentials to local.properties'
    env:
      SPORT_ID: ${{ parameters.sportId }}

  # 4. Build the release AAB for this sport flavor
  - task: Gradle@3
    displayName: 'Build ${{ parameters.sportFlavorName }} Release AAB'
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: ':composeApp:bundle${{ parameters.sportFlavorName }}Release'
      options: >
        -Pandroid.injected.signing.store.file=$(System.DefaultWorkingDirectory)/keystore.jks
        -Pandroid.injected.signing.store.password=$(${{ parameters.sportId }}-keystore-password)
        -Pandroid.injected.signing.key.alias=$(${{ parameters.sportId }}-keystore-alias)
        -Pandroid.injected.signing.key.password=$(${{ parameters.sportId }}-keystore-password)
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '17'

  # 5. Publish AAB as pipeline artifact
  - task: PublishBuildArtifacts@1
    displayName: 'Publish ${{ parameters.sportId }} AAB artifact'
    inputs:
      pathToPublish: 'composeApp/build/outputs/bundle/${{ parameters.sportId }}Release'
      artifactName: '${{ parameters.sportId }}-release-aab'

  # 6. Upload to Play Store internal track
  - task: GooglePlayRelease@4
    displayName: 'Upload ${{ parameters.sportFlavorName }} to Play Store internal track'
    inputs:
      serviceAccountJsonPlainText: '$(play-store-service-account-json)'
      applicationId: '${{ parameters.packageName }}'
      action: 'SingleBundle'
      bundleFile: 'composeApp/build/outputs/bundle/${{ parameters.sportId }}Release/*.aab'
      track: 'internal'
