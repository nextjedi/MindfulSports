# Reusable template — build and publish the Mindful Sports IPA to TestFlight.
# Called from ios-pipeline.yml.
# Fastlane handles xcodebuild complexity; Azure DevOps handles scheduling and secrets.

steps:

  # 1. Load secrets from Azure Key Vault
  - task: AzureKeyVault@2
    displayName: 'Load secrets from Key Vault'
    inputs:
      azureSubscription: 'MindfulSports-ServiceConnection'
      KeyVaultName: 'mindful-sports-kv'
      SecretsFilter: >
        supabase-url,
        supabase-anon-key,
        revenuecat-ios-key,
        match-certificates-password

  # 2. Install distribution certificate from Azure Secure Files
  - task: InstallAppleCertificate@2
    displayName: 'Install distribution certificate'
    inputs:
      certSecureFile: 'distribution.p12'
      certPwd: '$(match-certificates-password)'

  # 3. Install provisioning profile from Azure Secure Files
  - task: InstallAppleProvisioningProfile@1
    displayName: 'Install provisioning profile'
    inputs:
      provProfileSecureFile: 'mindful_sports_distribution.mobileprovision'

  # 4. Install Ruby dependencies for Fastlane
  - task: UseRubyVersion@0
    inputs:
      versionSpec: '>= 3.0'

  - bash: bundle install
    displayName: 'Install Fastlane (bundle install)'

  # 5. Fastlane build + TestFlight upload
  - bash: |
      bundle exec fastlane ios build \
        supabase_url:"$(supabase-url)" \
        supabase_key:"$(supabase-anon-key)" \
        revenuecat_key:"$(revenuecat-ios-key)"
    displayName: 'Fastlane: build and upload Mindful Sports'
