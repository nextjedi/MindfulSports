# Android CI/CD pipeline — builds the Mindful Sports AAB and uploads to Play Store.
# Triggers on pushes to main that touch composeApp or shared.
# Credentials are stored in Azure Key Vault (mindful-sports-kv).

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - composeApp/**
      - shared/**

pool:
  vmImage: 'ubuntu-latest'

steps:
  - template: templates/android-build.yml
